  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,25,27,0) 55%,rgba(23,25,27,.92) 100%)}
  .hero-text{position:absolute;left:20px;right:20px;bottom:12px;z-index:1}
  .hdr-bar{max-width:960px;margin:0 auto;padding:6px 20px 0}
  header h1,header .sub,header .meta{text-shadow:0 1px 8px rgba(0,0,0,.8)}
  header h1{margin:0;font-size:1.3rem;font-weight:800;letter-spacing:.04em}
  header .sub{margin:2px 0 0;font-size:1rem;font-weight:600}
  header .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 14px;font-size:.9rem;opacity:.9}
  header .hbtns{display:flex;gap:6px;flex-shrink:0}
  header .meta button{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:var(--white);border-radius:8px;padding:5px 10px;font-weight:600;cursor:pointer}
  nav{display:flex;gap:4px}
  nav button{flex:1;border:0;background:rgba(0,0,0,.35);color:#B9C3CC;padding:12px 6px;font-size:.95rem;font-weight:600;border-radius:10px 10px 0 0;cursor:pointer}
  nav button[aria-selected=true]{background:#2A2D30;color:#FFFFFF;box-shadow:inset 0 3px 0 var(--led)}
  nav button[hidden]{display:none}
  button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--led);outline-offset:2px}
  main{max-width:720px;margin:0 auto;padding:20px}
  section[hidden],[hidden]{display:none!important}
  h2{font-size:1.15rem;margin:0 0 12px}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
  label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:var(--white);color:var(--ink)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .field{margin-bottom:12px}
  .btn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:.95rem;cursor:pointer;background:var(--green);color:var(--white)}
  .btn.alt{background:var(--white);color:var(--green-d);border:1.5px solid var(--green)}
  .btn.warn{background:var(--white);color:var(--red);border:1.5px solid var(--red)}
  .btn.sm{padding:5px 9px;font-size:.8rem}
  .btn.full{width:100%}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:.82rem}
  td.num,th.num{text-align:right}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);border-top:3px solid var(--led)}
  .stat b{display:block;font-size:1.4rem}
  .stat span{font-size:.8rem;color:var(--muted)}

  /* Log masuk */
  .login{max-width:420px;margin:30px auto}
  .roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
  .roles button{border:1.5px solid var(--line);background:var(--white);border-radius:10px;padding:12px 4px;font-weight:700;color:var(--muted);cursor:pointer}
  .roles button[aria-pressed=true]{border-color:var(--green);background:var(--green);color:var(--white)}
  .err{color:var(--red);font-size:.9rem;min-height:1.4em;margin:8px 0 0}

  #reader{width:100%;border-radius:12px;overflow:hidden;background:#DDE5E2;min-height:40px}

  .popup.cash{background:rgba(196,120,0,.95)}
  .popup.cash .pop-icon{background:#C47800;font-size:26px}
  .popup.cash .pop-status{color:#A06200}

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ v===null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
};

let session = null, st = {}, card = null, scanner = null, loginRole = "staff";
const apiReady = () => /^https:\/\/script\.google\.com\//.test(API_URL);

/* ---------- Sambungan ke Google Sheets / Connection ---------- */
async function api(action, data={}){
  if(!apiReady()) throw {code:"noApi"};
  let j;
  try{
    const r = await fetch(API_URL,{method:"POST", body:JSON.stringify(Object.assign({action, token:session && session.token}, data))});
    j = await r.json();
  }catch(e){ throw {code:"net"}; }
  if(!j.ok && j.code==="auth" && action!=="login"){ await forceLogout(); throw {code:"auth"}; }
  return j;
}
function errText(code){
  const m = {net:"netErr",noApi:"noApi",auth:"sessionExp",pwWrong:"pwWrong",pwShort:"pwShort",need:"addNeed",
             aPwShort:"aPwShort",kPwBad:"kPwBad",forbidden:"forbidden",badPrice:"serverErr"};
  return T(m[code] || "serverErr");
}
let busyN = 0;
function busy(on){ busyN = Math.max(0, busyN + (on?1:-1)); $("busy").hidden = busyN===0; }
async function run(fn, btn){
  busy(true); if(btn) btn.disabled = true;
  try{ return await fn(); }
  catch(e){ toast(errText(e && e.code)); }
  finally{ busy(false); if(btn) btn.disabled = false; }
}
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3500); }

/* ---------- Data ---------- */
async function refresh(){
  if(!session) return;
  const j = await api("state");
  if(!j.ok) throw j;
  st = j; ALLOC = j.alloc || ALLOC; PMIN = j.min || PMIN; PMAX = j.max || PMAX;
  renderHeader(); renderLists();
  if(session.role!=="kantin") await loadCard();
}
async function loadCard(){
  const id = session.role==="staff" ? session.id : ($("pickStaff").value || ((st.staff||[])[0]||{}).id);
  if(!id){ card = null; renderTicket(); return; }
  const j = await api("card",{id});

}

/* ---------- Tolak kupon / Use coupon ---------- */
let cur = null;   // staff sedang dicaj / staff being charged
async function tolakKupon(raw){
  if(!session || !["kantin","hr"].includes(session.role)) return;
  const id = raw.trim().toUpperCase().replace(/^ROCAKUPON:/,"");
  openPopup("wait", T("processing"), id);
  try{
    const j = await api("lookup",{id});
    if(!j.ok){ result("bad", T("badQr"), T("notFound")(id)); return; }
    closePopup();
    cur = {id:j.id, name:j.name, baki:j.baki, force:false, recent:(j.last && j.last.ago < 60) ? j.last : null};
    openCharge();
  }catch(e){
    if(e && e.code==="auth"){ closePopup(); toast(T("sessionExp")); }
    else result("bad", T("scanFail"), errText(e && e.code));
  }
}
function openCharge(){
  $("cName").textContent = cur.name;
  $("cBal").textContent = T("curBal")(rm(cur.baki));
  $("cPrice").value = "";
  $("cQuick").innerHTML = QUICK.map(v=>`<button type="button" data-p="${v}">${v.toFixed(2)}</button>`).join("");
  if(cur.recent) cur.force = true;
  $("charge").hidden = false;
  updatePreview();
  setTimeout(()=>$("cPrice").focus(), 50);
}
function priceVal(){
  const v = $("cPrice").value.trim().replace(",",".");
  if(!/^\d+(\.\d{1,2})?$/.test(v)) return null;
  const n = Math.round(parseFloat(v)*100)/100;
  return (n >= PMIN && n <= PMAX) ? n : null;
}
function updatePreview(){
  const p = priceVal(), box = $("cPreview"), btn = $("btnCharge");
  let html = "";
  if(cur.recent) html += `<div class="pv warn">⚠ ${esc(T("recentMsg")(rm(cur.recent.harga), cur.recent.ago))}</div>`;
  if(cur.baki <= 0) html += `<div class="pv bad">${esc(T("empty"))}</div>`;
  if(p===null){
    if($("cPrice").value.trim()) html += `<div class="pv bad">${esc(T("badPrice")(rm(PMIN), rm(PMAX)))}</div>`;
    btn.disabled = true; btn.textContent = T("btnConfirm")("");
  } else {
    const d = Math.min(cur.baki, p), c = Math.round((p-d)*100)/100;
    if(c > 0){
      html += `<div class="pv bad"><b>-${rm(c)}</b><br>${esc(T("shortMsg")(rm(d), rm(c)))}</div>`;
      btn.textContent = T("btnConfirmCash")(rm(c));
    } else {
      html += `<div class="pv ok">${esc(T("afterBal")(rm(Math.round((cur.baki-p)*100)/100)))}</div>`;
      btn.textContent = T("btnConfirm")(rm(p));
    }
    btn.disabled = false;
  }
  box.innerHTML = html;
}
$("cPrice").oninput = updatePreview;
$("cPrice").onkeydown = e=>{ if(e.key==="Enter" && !$("btnCharge").disabled) $("btnCharge").click(); };
$("cQuick").onclick = e=>{ const v = e.target.dataset.p; if(v){ $("cPrice").value = Number(v).toFixed(2); updatePreview(); } };
$("btnCancel").onclick = ()=>{ $("charge").hidden = true; cur = null; };
$("btnCharge").onclick = async ()=>{
  const p = priceVal(); if(p===null || !cur) return;
  const short = p > cur.baki;
  $("charge").hidden = true;
  openPopup("wait", T("processing"), cur.name);
  try{
    const j = await api("charge",{id:cur.id, harga:p, force:cur.force, allowShort:short});
    if(j.ok){
      if(j.tunai > 0) result("cash", j.name, T("cashMsg")(rm(j.ditolak), rm(j.tunai)), "-"+rm(j.tunai), T("cashLeft"));
      else result("ok", j.name, T("okMsg")(rm(j.harga)), rm(j.baki), T("balLeft"));
      cur = null; refresh().catch(()=>{});
    } else if(j.code==="recent"){
      closePopup(); cur.recent = j.last; openCharge(); $("cPrice").value = p.toFixed(2); updatePreview(); $("btnCharge").textContent = T("btnAnyway");
    } else if(j.code==="short"){
      closePopup(); cur.baki = j.baki; openCharge(); $("cPrice").value = p.toFixed(2); updatePreview();
    } else if(j.code==="notfound") result("bad", T("badQr"), T("notFound")(cur.id));
    else if(j.code==="badPrice"){ closePopup(); openCharge(); }
    else result("bad", T("scanFail"), errText(j.code));
  }catch(e){
    if(e && e.code==="auth"){ closePopup(); toast(T("sessionExp")); }
    else result("bad", T("scanFail"), errText(e && e.code));
  }
};

/* Pop-up + bunyi + getaran / Pop-up + sound + vibration */
let actx = null;
function unlockAudio(){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){}
}
function beep(type){
  const ok = type==="ok";
  try{
    if(actx){
      const tones = ok ? [[880,0,.13],[1320,.15,.18]] : type==="cash" ? [[660,0,.18],[440,.22,.18],[660,.44,.25]] : [[200,0,.55]];
      tones.forEach(([f,t,d])=>{
        const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + t;
        o.type = ok ? "sine" : "square"; o.frequency.value = f;
        g.gain.setValueAtTime(.3,t0); g.gain.exponentialRampToValueAtTime(.001,t0+d);
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+d);
      });
    }
    if(navigator.vibrate) navigator.vibrate(ok ? 150 : type==="cash" ? [150,80,150,80,300] : [250,100,250]);
  }catch(e){}
}
function openPopup(type,title,msg,big,left){
  const p = $("popup");
  p.className = "popup "+type;
  $("popIcon").textContent = type==="ok" ? "✓" : type==="bad" ? "✕" : type==="cash" ? "RM" : "";
  $("popStatus").textContent = type==="ok" ? T("scanOk") : type==="bad" ? T("scanFail") : type==="cash" ? T("cashStatus") : "";
  $("popTitle").textContent = title;
  $("popMsg").textContent = msg || "";
  $("popBig").textContent = big!==undefined ? big : "";
  $("popLeft").textContent = left || "";
  p.hidden = false;
  if(type!=="wait"){ beep(type); $("btnNext").focus(); }
}
function closePopup(){ $("popup").hidden = true; }
$("btnNext").onclick = ()=>{ unlockAudio(); closePopup(); startCam(); };

document.addEventListener("keydown",e=>{

  if(!$("popup").hidden && !$("popup").classList.contains("wait")) closePopup();
});

let scanBusy = false;
async function startCam(){
  if(typeof Html5Qrcode==="undefined") return show($("result"),"bad",T("camNA"),T("camNAmsg"));
  if(scanner) return;
  $("result").innerHTML = "";
  scanner = new Html5Qrcode("reader"); scanBusy = false;
  try{
    await scanner.start({facingMode:"environment"},{fps:10,qrbox:220}, async txt=>{
      if(scanBusy) return;
      scanBusy = true;
      await stopCam();
      await tolakKupon(txt);
    });
    $("btnCam").hidden=true; $("btnCamStop").hidden=false;
  }catch(e){ scanner=null; show($("result"),"bad",T("camFail"),T("camFailMsg")); }
}
async function stopCam(){ if(scanner){ try{ await scanner.stop(); }catch(e){} scanner=null; } $("btnCam").hidden=false; $("btnCamStop").hidden=true; }

    if(!j.ok) return toast(errText(j.code));
    toast(T("aResetPw")(j.name));
  });
  if(d && confirm(T("cDel")(d))) run(async ()=>{
    const j = await api("removeStaff",{id:d});
    if(!j.ok) return toast(errText(j.code));
    await refresh();
  });
};
$("btnReset").onclick = ()=>{ if(confirm(T("cResetAll"))) run(async ()=>{ await api("resetAll"); await refresh(); }, $("btnReset")); };
$("btnAPw").onclick = ()=>run(async ()=>{
  const m=$("setMsg"); m.className="err";
  const j = await api("setAdminPw",{pw:$("aPw").value});
  if(!j.ok) return m.textContent = errText(j.code);
  $("aPw").value=""; m.className="err okmsg"; m.textContent = T("aPwDone");
}, $("btnAPw"));
$("btnKPw").onclick = ()=>run(async ()=>{
  const m=$("setMsg"); m.className="err";
  const j = await api("setKantinPw",{pw:$("kPw").value});
  if(!j.ok) return m.textContent = errText(j.code);
  $("kPw").value=""; m.className="err okmsg"; m.textContent = T("kPwDone");
}, $("btnKPw"));
$("btnCsv").onclick = ()=>{
  const rows = [T("csv")].concat((st.staff||[]).map(s=>[s.id,s.name,s.dept,(ALLOC-s.baki).toFixed(2),Number(s.baki).toFixed(2)]));
  const csv = "\uFEFF" + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download = `${T("csvFile")}-${st.month || bulanIni()}.csv`; a.click();
};
